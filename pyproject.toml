[project]
name = 'ml-sales-dashboard'
version = '2.0.0'
description = 'Interactive Streamlit dashboard for Mercado Livre sales analysis.'
readme = 'README.md'
requires-python = '>=3.12'
license = { text = 'MIT' }
dependencies = [
    'streamlit>=1.32',
    'pandas>=2.2',
    'plotly>=5.22',
    'numpy>=1.26',
    'pyarrow>=15.0',
    'pillow>=10.2',
]

[tool.ruff]
line-length = 100
target-version = 'py312'

[tool.ruff.lint]
select = ['E', 'F', 'I', 'UP', 'B', 'C4', 'SIM', 'Q']
ignore = ['E501']

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'
multiline-quotes = 'double'
docstring-quotes = 'double'

[tool.ruff.lint.isort]
force-single-line = false
combine-as-imports = true
known-first-party = ['sales_dashboard', 'tests']

[tool.ruff.format]
quote-style = 'single'

[tool.pytest.ini_options]
testpaths = ['tests']
python_files = ['test_*.py']
addopts = '-ra'

[tool.coverage.run]
source = ['sales_dashboard']
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
